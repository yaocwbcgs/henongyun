name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json

      - name: 安装服务端依赖
        working-directory: server
        run: npm ci

      - name: 安装前端依赖
        working-directory: web
        run: npm ci

      - name: 构建前端
        run: npm run build

      - name: 启动服务（测试环境配置）
        working-directory: server
        env:
          NODE_ENV: production
          PORT: 3001
          PUBLIC_BASE_URL: http://localhost:3001
          WEB_ORIGIN: http://localhost:3001
          JWT_SECRET: ci-only-secret-not-used-in-production-0000000000000000
          DEMO_SEED: 'true'
        run: |
          node src/index.js &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/health > /dev/null; then
              echo "service ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "service failed to start"
          exit 1

      - name: 端到端验收测试
        working-directory: server
        run: npm run test:e2e

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            server/data/*.log
            server/uploads/
          if-no-files-found: ignore
